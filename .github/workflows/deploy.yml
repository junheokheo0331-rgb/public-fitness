# GitHub Pages 배포.
# Actions 탭에서 한 번 돌면 https://<계정>.github.io/<레포이름>/ 에 뜬다.
#
# 켜는 법: Settings → Pages → Source 를 "GitHub Actions" 로 바꾼다.
#          (기본값인 "Deploy from a branch" 로 두면 이 워크플로가 무시된다)
#
# 이 워크플로는 목 데이터로 빌드한다. Supabase 를 붙이려면
# Settings → Secrets and variables → Actions 에 VITE_SUPABASE_URL 과
# VITE_SUPABASE_ANON_KEY 를 넣으면 아래 env 가 자동으로 집어간다.
# anon key 는 번들에 그대로 박히지만, 그게 정상이다. 권한은 RLS 가 지킨다.
# service_role key 는 절대 넣지 마세요. 그건 RLS 를 통째로 우회합니다.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # Actions 탭에서 수동 실행도 가능하게

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: 엔진 테스트
        run: npm test          # 여기서 깨지면 배포하지 않는다

      - name: 빌드
        env:
          # 프로젝트 페이지는 /<레포이름>/ 아래에 놓인다.
          # 이 값이 없으면 CSS·JS 경로가 전부 깨진다.
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_KAKAO_MAP_KEY: ${{ secrets.VITE_KAKAO_MAP_KEY }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
